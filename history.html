<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My History | BINIBINI Beauty Lounge</title>

    <link rel="stylesheet" href="style.css">

    <style>

        .history-page {
            min-height: 100vh;
            background: #faf6f2;
            padding: 120px 8% 70px;
        }

        .history-header {
            text-align: center;
            margin-bottom: 45px;
        }

        .history-header .eyebrow {
            letter-spacing: 4px;
        }

        .history-header h1 {
            font-family: "Playfair Display", serif;
            font-size: 48px;
            color: #332b2e;
            margin: 10px 0;
        }

        .history-header p {
            color: #6f6265;
        }

        .history-section {
            max-width: 1000px;
            margin: 0 auto 50px;
        }

        .history-section h2 {
            font-family: "Playfair Display", serif;
            font-size: 32px;
            color: #332b2e;
            margin-bottom: 20px;
        }

        .history-card {
            background: rgba(255,255,255,0.85);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 18px;
            box-shadow: 0 8px 25px rgba(48,39,42,0.08);
            border: 1px solid rgba(120,90,90,0.12);
        }

        .history-top {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .history-number {
            font-weight: 600;
            color: #80515f;
        }

        .history-date {
            color: #777;
            font-size: 14px;
        }

        .history-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px 30px;
        }

        .history-details p {
            margin: 4px 0;
            color: #4f4749;
        }

        .history-details strong {
            color: #332b2e;
        }

        .status {
            display: inline-block;
            padding: 6px 13px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .status-confirmed {
            background: #e7f3e8;
            color: #356b3d;
        }

        .status-pending {
            background: #fff3d6;
            color: #8a6500;
        }

        .status-cancelled {
            background: #f8e2e2;
            color: #9b4141;
        }

        .status-completed {
            background: #e7eef8;
            color: #3d5e87;
        }

        .empty-history {
            background: rgba(255,255,255,0.65);
            border-radius: 16px;
            padding: 35px;
            text-align: center;
            color: #777;
        }

        .history-back {
            display: inline-block;
            margin-top: 30px;
            text-decoration: none;
        }

        .purchase-items {
            margin-top: 18px;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }

        .purchase-item {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            padding: 8px 0;
        }

        .purchase-total {
            border-top: 1px solid #ddd;
            margin-top: 15px;
            padding-top: 15px;
            text-align: right;
            font-size: 18px;
            font-weight: 600;
            color: #80515f;
        }

        @media (max-width: 700px) {

            .history-page {
                padding: 100px 5% 50px;
            }

            .history-header h1 {
                font-size: 36px;
            }

            .history-details {
                grid-template-columns: 1fr;
            }

            .purchase-item {
                flex-direction: column;
                gap: 3px;
            }

        }

    </style>

</head>

<body>

<section class="history-page">

    <div class="history-header">

        <p class="eyebrow">
            MEMBER AREA
        </p>

        <h1>
            My History
        </h1>

        <p id="member-name">
            Loading member information...
        </p>

        <a href="index.html"
           class="btn btn-outline history-back">
            ← Back to BINIBINI
        </a>

    </div>


    <!-- BOOKING HISTORY -->

    <div class="history-section">

        <h2>
            📅 Booking History
        </h2>

        <div id="booking-history">
        </div>

    </div>


    <!-- PURCHASE HISTORY -->

    <div class="history-section">

        <h2>
            🛍️ Purchase History
        </h2>

        <div id="purchase-history">
        </div>

    </div>

</section>


<script>

const currentUser =
    JSON.parse(sessionStorage.getItem("biniUser") || "null");


if (!currentUser) {

    alert("Please log in to view your history.");

    window.location.href = "index.html";

} else {

    document.getElementById("member-name").textContent =
        "Welcome back, " + currentUser.name;

    loadBookingHistory();
    loadPurchaseHistory();

}


/* ==========================================
   BOOKING HISTORY
========================================== */

function loadBookingHistory() {

    const bookings =
        JSON.parse(
            localStorage.getItem("biniAppointments")
            || "[]"
        );

    const customerBookings =
        bookings.filter(booking =>
            (booking.email || "").toLowerCase()
            ===
            currentUser.email.toLowerCase()
        );

    const container =
        document.getElementById("booking-history");


    if (customerBookings.length === 0) {

        container.innerHTML = `
            <div class="empty-history">
                <p>You don't have any booking history yet.</p>
                <a href="booking.html"
                   class="btn btn-primary">
                    Book an Appointment
                </a>
            </div>
        `;

        return;
    }


    customerBookings
        .slice()
        .reverse()
        .forEach(booking => {

            const status =
                booking.status || "Pending";

            let statusClass =
                "status-pending";

            if (status === "Confirmed") {
                statusClass = "status-confirmed";
            }

            if (status === "Cancelled") {
                statusClass = "status-cancelled";
            }


            container.innerHTML += `

                <div class="history-card">

                    <div class="history-top">

                        <div>
                            <div class="history-number">
                                ${booking.bookingNumber || "Booking"}
                            </div>

                            <div class="history-date">
                                ${booking.date || ""}
                                ${booking.time || ""}
                            </div>
                        </div>

                        <span class="status ${statusClass}">
                            ${status}
                        </span>

                    </div>


                    <div class="history-details">

                        <p>
                            <strong>Service:</strong>
                            ${booking.service || ""}
                        </p>

                        <p>
                            <strong>Price:</strong>
                            ₱${Number(booking.price || 0).toLocaleString("en-PH")}
                        </p>

                        <p>
                            <strong>Reservation Fee:</strong>
                            ₱${Number(booking.fee || 0).toLocaleString("en-PH")}
                        </p>

                        <p>
                            <strong>Payment:</strong>
                            ${(booking.paymentMethod || "").toUpperCase()}
                        </p>

                    </div>

                </div>

            `;

        });

}


/* ==========================================
   PURCHASE HISTORY
========================================== */

function loadPurchaseHistory() {

    const purchases =
        JSON.parse(
            localStorage.getItem("biniPurchases")
            || "[]"
        );


    const customerPurchases =
        purchases.filter(purchase =>
            (purchase.email || "").toLowerCase()
            ===
            currentUser.email.toLowerCase()
        );


    const container =
        document.getElementById("purchase-history");


    if (customerPurchases.length === 0) {

        container.innerHTML = `
            <div class="empty-history">

                <p>
                    You don't have any purchase history yet.
                </p>

                <a href="index.html#products"
                   class="btn btn-primary">
                    Browse Products
                </a>

            </div>
        `;

        return;
    }


    customerPurchases
        .slice()
        .reverse()
        .forEach(purchase => {

            const purchaseDate =
                new Date(purchase.date)
                    .toLocaleString("en-PH");


            let itemsHTML = "";

            purchase.items.forEach(item => {

                itemsHTML += `

                    <div class="purchase-item">

                        <span>
                            ${item.productName}
                            × ${item.quantity}
                        </span>

                        <strong>
                            ₱${Number(item.subtotal)
                                .toLocaleString("en-PH")}
                        </strong>

                    </div>

                `;

            });


            container.innerHTML += `

                <div class="history-card">

                    <div class="history-top">

                        <div>

                            <div class="history-number">
                                ${purchase.orderNumber}
                            </div>

                            <div class="history-date">
                                ${purchaseDate}
                            </div>

                        </div>

                        <span class="status status-completed">
                            ${purchase.status}
                        </span>

                    </div>


                    <div class="purchase-items">

                        ${itemsHTML}

                    </div>


                    <div class="history-details">

                        <p>
                            <strong>Order Type:</strong>
                            ${purchase.orderType}
                        </p>

                        <p>
                            <strong>Payment:</strong>
                            ${purchase.paymentMethod.toUpperCase()}
                        </p>

                    </div>


                    <div class="purchase-total">

                        Total:
                        ₱${Number(purchase.total)
                            .toLocaleString("en-PH")}

                    </div>

                </div>

            `;

        });

}

</script>

</body>
</html>
